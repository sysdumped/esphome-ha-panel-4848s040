# =============================================================================
# Hardware: Guition ESP32-S3-4848S040 (4", 480x480, ST7701S + GT911)
# Fonte pinout: https://devices.esphome.io/devices/Guition-ESP32-S3-4848S040
#
# Per un'altra scheda basta sostituire questo file: il resto del progetto
# richiede solo gli id  tft_display, tft_touch, display_backlight.
# =============================================================================

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# GPIO19/20 sono usati da touch (SDA) e display: il logger NON deve usare
# l'USB-Serial-JTAG (default su ESP32-S3), altrimenti il touch non risponde.
logger:
  hardware_uart: UART0

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: display_backlight
    name: "Retroilluminazione"
    icon: mdi:brightness-6
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  scan: true          # nel log di avvio deve comparire il GT911 (0x5D o 0x14)
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

display:
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    i2c_id: touchscreen_bus
    # Il GT911 di questa scheda dichiara una risoluzione di 1024x600 ma invia
    # coordinate 0..480: senza calibrazione esplicita i tocchi finiscono
    # scalati verso l'angolo in alto a sinistra (x*0.47, y*0.8).
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    on_touch:
      - lambda: 'ESP_LOGD("touch", "tocco a x=%d y=%d", touch.x, touch.y);'
    on_release:
      # Al tocco riporta la luminosita' piena
      - light.turn_on:
          id: display_backlight
          brightness: ${brightness_active}
