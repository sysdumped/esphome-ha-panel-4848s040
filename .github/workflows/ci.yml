name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [tests/ci.yaml, tests/ci-relays.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Secrets fittizi
        run: |
          cat > tests/secrets.yaml <<EOS
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          ap_password: "ci-password"
          api_encryption_key: "$(openssl rand -base64 32)"
          ota_password: "ci"
          EOS
      - run: esphome config ${{ matrix.config }} > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Note dal CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Nessuna sezione [$version] in CHANGELOG.md"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
